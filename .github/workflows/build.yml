# Test, build and push the image. Nothing here deploys: the selfhost panel polls
# GHCR and deploys itself (selfhost/docs/08-ci-cd.md). Actions pinned by SHA as
# in inviteQr; tags are computed so a branch run cannot move :latest.

name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/heshamamoudi/portfolio

jobs:
  test-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: dotnet test
        run: docker run --rm -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:8.0@sha256:bb32ba3ba3ea36e38572d9d8db76fa15f7cbf722f3f886e06bca6d528bd4fba8 dotnet test tests/Profile.Api.Tests --nologo -v minimal

  test-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: vitest and build
        run: docker run --rm -v "$PWD:/src" -w /src/web node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 sh -c "npm ci && npm test && npm run build"

  amd64:
    needs: [test-api, test-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          set -euo pipefail
          {
            echo 'list<<TAGS'
            if [ "${{ github.ref }}" = 'refs/heads/main' ]; then echo "${IMAGE}:latest"; fi
            echo "${IMAGE}:sha-${{ github.sha }}"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=min
          provenance: false
          sbom: false
